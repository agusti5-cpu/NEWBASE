<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWBASE</title><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#17202a}main{max-width:1000px;margin:auto;padding:32px}h1{font-size:42px;margin-bottom:4px}.sub{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:28px 0}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 4px 18px #00000008}.num{font-size:30px;font-weight:700}.opp{margin-top:16px}.muted{color:#667085}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff;font-size:12px}</style></head><body><main><span class="status">NEWBASE · motor automàtic</span><h1>Oportunitats detectades</h1><p class="sub">Resultats generats automàticament a partir de dades públiques.</p><section class="grid"><div class="card"><div class="muted">Oportunitats publicables</div><div class="num" id="published">—</div></div><div class="card"><div class="muted">Candidats detectats</div><div class="num" id="candidates">—</div></div><div class="card"><div class="muted">Última execució</div><div class="num" id="updated">—</div></div></section><div id="list"></div></main><script>async function load(){try{const r=await fetch('./data/latest-trade-run.json?'+Date.now());const d=await r.json();document.querySelector('#published').textContent=d.accepted?.length??0;document.querySelector('#candidates').textContent=d.inputCount??d.normalizedCount??0;document.querySelector('#updated').textContent=d.generatedAt?new Date(d.generatedAt).toLocaleDateString('ca-ES'):'—';const items=d.accepted||[];document.querySelector('#list').innerHTML=items.length?items.map(o=>`<article class="card opp"><h2>${o.productOrService||'Oportunitat'}</h2><p>${o.originMarket||'—'} → ${o.targetMarket||'—'}</p><p class="muted">Demanda: ${Math.round(o.signals?.demand??0)} · Creixement: ${Math.round(o.signals?.growth??0)} · Confiança: ${Math.round((o.confidence??0)*100)}%</p></article>`).join(''):'<div class="card"><h2>Encara no hi ha oportunitats publicables</h2><p class="muted">NEWBASE continua detectant i validant dades automàticament.</p></div>'}catch(e){document.querySelector('#list').innerHTML='<div class="card"><h2>Esperant dades del motor</h2><p class="muted">La interfície està preparada; les dades apareixeran quan el pipeline les publiqui.</p></div>'}}load();setInterval(load,60000)</script></body></html>
