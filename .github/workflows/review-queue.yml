name: NEWBASE review queue

# Keep CI validation attached to the current main revision.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/review-queue.json'
      - 'data/latest-review-queue-run.json'
  schedule:
    - cron: '17 7 * * *'

concurrency:
  group: newbase-review-queue-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run complete test suite
        run: npm test

      - name: Publish review queue state
        run: |
          git config user.name 'NEWBASE bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node monitor/review-queue-runner.js > data/latest-review-queue-run.json
            git add data/review-queue.json data/latest-review-queue-run.json
            if git diff --cached --quiet; then
              echo 'No review queue changes.'
              exit 0
            fi
            git commit -m 'Update automatic review queue'
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
            echo "Concurrent update detected; regenerating review queue ($attempt/5)."
          done
          echo 'Unable to publish review queue state after 5 attempts.'
          exit 1
