name: Match Engine Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/match-engine/**'
      - 'engine/**'
      - 'tests/**'
      - '.github/workflows/match-engine-tests.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'src/match-engine/**'
      - 'engine/**'
      - 'tests/**'
      - '.github/workflows/match-engine-tests.yml'
      - 'package.json'

jobs:
  test-match-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Match Engine and integration tests
        run: npm test
