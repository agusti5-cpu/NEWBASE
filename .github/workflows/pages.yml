name: Deploy NEWBASE web

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["NEWBASE Trade Detector"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare public data
        run: |
          cp data/latest-trade-run.json web/latest-trade-run.json
          if [ -f data/opvilo-feed.json ]; then cp data/opvilo-feed.json web/opvilo-feed.json; else printf '{"schema":"opvilo-feed/v1","generatedAt":null,"source":"NEWBASE","status":"unavailable","count":0,"opportunities":[]}\n' > web/opvilo-feed.json; fi
          if [ -f data/trade-history.json ]; then cp data/trade-history.json web/trade-history.json; else printf '[]\n' > web/trade-history.json; fi

      - name: Prepare private admin data
        run: |
          mkdir -p web/admin/data
          cp data/latest-trade-run.json web/admin/data/latest-trade-run.json
          cp data/opvilo-feed.json web/admin/data/opvilo-feed.json
          if [ -f data/latest-review-queue-run.json ]; then cp data/latest-review-queue-run.json web/admin/data/latest-review-queue-run.json; else printf '{}\n' > web/admin/data/latest-review-queue-run.json; fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 880fb60cd44a70d97ac2d07750ea42f5
          command: pages deploy web --project-name=opvilo-landing --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
