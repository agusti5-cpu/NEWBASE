name: NEWBASE trade detector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/latest-trade-run.json'
  schedule:
    - cron: '47 6 * * 1'

concurrency:
  group: newbase-trade-detector-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run complete test suite
        run: npm test

      - name: Run trade detector
        run: node monitor/run-trade.js > data/latest-trade-run.json

      - name: Publish detector output
        run: |
          git config user.name 'NEWBASE bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest-trade-run.json
          if git diff --cached --quiet; then
            echo 'No trade detector output changes.'
            exit 0
          fi
          git commit -m 'Update trade detector output'
          git pull --rebase origin main
          git push origin HEAD:main
