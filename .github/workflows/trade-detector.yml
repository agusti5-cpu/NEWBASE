name: NEWBASE trade detector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/latest-trade-run.json'
      - 'data/trade-history.json'
      - 'data/opvilo-feed.json'
  schedule:
    - cron: '47 6 * * *'

concurrency:
  group: newbase-trade-detector-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run complete test suite
        run: npm test

      - name: Run trade detector
        run: node monitor/run-trade.js > data/latest-trade-run.json

      - name: Build movement history
        run: node monitor/update-trade-history.js

      - name: Build OPVILO publication feed
        run: node monitor/write-opvilo-output.js > data/opvilo-feed.json

      - name: Publish detector output, history and OPVILO feed
        run: |
          git config user.name 'NEWBASE bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git add data/latest-trade-run.json data/trade-history.json data/opvilo-feed.json
            if git diff --cached --quiet; then
              echo 'No trade detector output changes.'
              exit 0
            fi
            git commit -m 'Update trade detector output and OPVILO feed'
            if git pull --rebase origin main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            fi
            git rebase --abort || true
            git reset --hard origin/main
            node monitor/run-trade.js > data/latest-trade-run.json
            node monitor/update-trade-history.js
            node monitor/write-opvilo-output.js > data/opvilo-feed.json
          done
          echo 'Unable to publish trade detector output after 3 attempts.'
          exit 1
