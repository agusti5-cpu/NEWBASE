name: NEWBASE Trade Detector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  detect-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Run multi-source connector orchestration
        run: node --input-type=module -e "import('./connectors/connector-orchestrator.js').then(async ({runAllConnectors}) => { const r=await runAllConnectors(); console.log(JSON.stringify(r,null,2)); })"

      - name: Run trade detector
        run: node monitor/run-trade.js

      - name: Publish generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data || true
          git diff --cached --quiet || git commit -m 'chore: publish automated NEWBASE data'
          git push
