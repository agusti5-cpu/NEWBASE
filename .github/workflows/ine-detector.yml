name: NEWBASE INE detector

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: newbase-ine-detector-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Run INE detector
        run: node monitor/publish-ine.js > data/latest-ine-run.json

      - name: Publish detector output
        run: |
          git config user.name 'NEWBASE bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest-ine-run.json
          if git diff --cached --quiet; then
            echo 'No detector output changes.'
            exit 0
          fi
          git commit -m 'Update INE detector output'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              echo 'Rebase conflict detected; discarding generated output and regenerating from current main.'
              git rebase --abort || true
              git reset --hard origin/main
              node monitor/publish-ine.js > data/latest-ine-run.json
              git add data/latest-ine-run.json
              git diff --cached --quiet && exit 0
              git commit -m 'Update INE detector output'
            }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent push detected; retrying publication ($attempt/5)."
          done
          echo 'Unable to publish INE detector output after 5 attempts.'
          exit 1
